<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - College Info Hub</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>
                College Info Hub
            </h1>

            <h2>
                Admin Login
            </h2>

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </div>


    <script src="../js/login.js"></script>

</body>

</html>
